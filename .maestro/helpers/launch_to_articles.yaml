appId: org.cru.godtools.beta
name: Launch to articles (Questions About God article tool)
---
- launchApp:
    stopApp: true
- runFlow: dismiss_onboarding.yaml
- openLink: "godtools://org.cru.godtools/tool/article/es/en"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- assertVisible:
    id: "Articles"
