appId: org.cru.godtools.beta
name: Launch to Knowing God Personally tract (training-capable)
---
- launchApp:
    stopApp: true
- runFlow: dismiss_onboarding.yaml
- openLink: "godtools://org.cru.godtools/tool/tract/kgp/en"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- assertVisible:
    id: "Tract"
