---
- launchApp:
    stopApp: true
- runFlow: ../../../helpers/dismiss_onboarding.yaml
- openLink: "godtools://org.cru.godtools/tool/tract/emojitoolupgrade/en"
- runFlow:
    when:
      platform: iOS
