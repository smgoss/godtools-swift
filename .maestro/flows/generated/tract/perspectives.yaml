appId: org.cru.godtools.beta
name: TRACT - Satisfied? (perspectives)
tags:
  - generated
  - tract
  - tool-perspectives
---
- launchApp:
    stopApp: true
- runFlow: ../../../helpers/dismiss_onboarding.yaml
- openLink: "godtools://org.cru.godtools/tool/tract/perspectives/en"
- runFlow:
    when:
      platform: iOS
      visible: "Open"
    commands:
      - tapOn: "Open"
- assertVisible: "Satisfied?"
- takeScreenshot: "${SNAPSHOT_DIR}/perspectives/00-open"
- swipe:
    start: 90%, 50%
    end: 10%, 50%
- takeScreenshot: "${SNAPSHOT_DIR}/perspectives/01-page-1"
- swipe:
    start: 90%, 50%
    end: 10%, 50%
- takeScreenshot: "${SNAPSHOT_DIR}/perspectives/02-page-2"
- swipe:
    start: 90%, 50%
    end: 10%, 50%
- takeScreenshot: "${SNAPSHOT_DIR}/perspectives/03-page-3"
- swipe:
    start: 90%, 50%
    end: 10%, 50%
- takeScreenshot: "${SNAPSHOT_DIR}/perspectives/04-page-4"
