appId: org.cru.godtools.beta
name: TRACT - Emoji Survey (emojitool)
tags:
  - generated
  - tract
  - tool-emojitool
---
- launchApp:
    stopApp: true
- runFlow: ../../../helpers/dismiss_onboarding.yaml
- openLink: "godtools://org.cru.godtools/tool/tract/emojitool/en"
- runFlow:
    when:
      platform: iOS
      visible: "Open"
    commands:
      - tapOn: "Open"
- assertVisible:
    id: "Tract"
- assertVisible: "Emoji Survey"
- assertVisible: "Emoji Survey is a fun way to have a spiritual conversation"
- takeScreenshot: "${SNAPSHOT_DIR}/emojitool/00-01-home"
- swipe:
    start: 90%, 50%
    end: 10%, 50%
- takeScreenshot: "${SNAPSHOT_DIR}/emojitool/01-02-emojitool-xml"
