appId: org.cru.godtools.beta
name: Learn to share - close returns to tract
tags:
  - learn_to_share
# Gated on Learn To Share availability — see 01 for context.
---
- runFlow: ../../helpers/launch_to_spotlight_tool_details.yaml
- runFlow:
    when:
      visible:
        id: "Learn To Share"
    commands:
      - tapOn:
          id: "Learn To Share"
      - assertVisible:
          id: "learnToShareTool"
      - tapOn:
          id: "Close"
      - assertVisible:
          id: "Tract"
