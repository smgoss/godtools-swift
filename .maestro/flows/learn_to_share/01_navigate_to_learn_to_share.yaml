appId: org.cru.godtools.beta
name: Learn to share - navigate from tool details
tags:
  - learn_to_share
# The "Learn To Share" button is gated by the tool translation
# manifest having hasTips: true. On staging no published tool
# currently surfaces this; the assertion is wrapped in a `when
# visible` check so the flow no-ops when the data isn't there
# rather than failing every run. The test exercises the navigation
# path as soon as a tool with tips is published.
---
- runFlow: ../../helpers/launch_to_spotlight_tool_details.yaml
- runFlow:
    when:
      visible:
        id: "Learn To Share"
    commands:
      - tapOn:
          id: "Learn To Share"
      - assertVisible:
          id: "learnToShareTool"
