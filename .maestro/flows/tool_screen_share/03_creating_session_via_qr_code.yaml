appId: org.cru.godtools.beta
name: Tool screen share - tutorial → Generate QR Code → QR code screen
tags:
  - tool_screen_share
# After Generate QR Code, the app momentarily shows
# CreatingToolScreenShareSession while the session is being built, then
# transitions to ToolScreenShareQRCode. The "Creating" screen is too
# transient to assert against reliably (often gone before the
# assertion poll finds it). Assert the end-state ToolScreenShareQRCode
# instead — that's what the user actually sees and interacts with.
---
- runFlow: ../../helpers/launch_to_tract.yaml
- tapOn:
    id: "Tool Settings"
- assertVisible:
    id: "Tool Settings"
- tapOn:
    id: "Share Screen"
- assertVisible:
    id: "Tool Screen Share Tutorial"
- repeat:
    while:
      visible:
        id: "Continue"
    commands:
      - tapOn:
          id: "Continue"
- tapOn:
    id: "Generate QR Code"
- assertVisible:
    id: "Tool Screen Share QR Code"
