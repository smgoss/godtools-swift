appId: org.cru.godtools.beta
name: Tool Training - initial screen
tags:
  - tool_training
  - smoke
# ToolTraining is reachable via Tool Settings → Training Tips, but only
# when the underlying tract was opened with `trainingTipsEnabled: true`.
# The Learn-To-Share path sets that flag, so the test funnels through it.
# The Learn To Share button is itself gated by the tool translation
# manifest having hasTips: true. On staging no published tool currently
# surfaces it; the path is wrapped in a `when visible` check so the flow
# no-ops there rather than failing every run. As soon as a tool with tips
# is published the test exercises the full navigation chain.
---
- runFlow: ../../helpers/launch_to_spotlight_tool_details.yaml
- runFlow:
    when:
      visible:
        id: "Learn To Share"
    commands:
      - tapOn:
          id: "Learn To Share"
      - assertVisible:
          id: "learnToShareTool"
      - repeat:
          while:
            visible:
              id: "Continue"
          commands:
            - tapOn:
                id: "Continue"
      - tapOn:
          id: "Start Training"
      - assertVisible:
          id: "Tract"
      - tapOn:
          id: "Tool Settings"
      - assertVisible:
          id: "Tool Settings"
      - tapOn:
          id: "Training Tips"
      - assertVisible:
          id: "Tool Training"
