appId: org.cru.godtools.beta
name: Favorites - favorite a tool then view all favorites
tags:
  - favorites
  - smoke
# Uses clearState: true to start with no favorites — otherwise the
# regex tap on `Tool - .+` may hit an already-favorited tool from a
# prior test, toggling it OFF and producing an empty Favorites tab
# where View All is not rendered.
---
- launchApp:
    clearState: true
    stopApp: true
- runFlow: ../../helpers/dismiss_onboarding.yaml
- openLink: "godtools://org.cru.godtools/dashboard/tools"
- runFlow: ../../helpers/dismiss_open_app_prompt.yaml
- assertVisible:
    id: "Dashboard Tools"
- tapOn:
    id: "Tool - .+"
- assertVisible:
    id: "Tool Details"
- tapOn:
    id: "Toggle Tool Favorite"
- tapOn:
    id: "Tool Details Nav Back"
- tapOn:
    id: "Dashboard Tab Favorites"
- assertVisible:
    id: "Dashboard Favorites"
- tapOn:
    id: "View All Favorite Tools"
- assertVisible:
    id: "All Your Favorite Tools"
