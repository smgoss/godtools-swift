appId: org.cru.godtools.beta
name: Favorites - favorite a tool then view all favorites
tags:
  - favorites
  - smoke
# After favoriting a tool from the Tool Details screen and tapping back,
# the app surfaces the Dashboard Favorites tab (not the Tools tab where
# we entered from), so the View All button is reachable directly.
---
- runFlow: ../../helpers/launch_to_tool_details.yaml
- tapOn:
    id: "Toggle Tool Favorite"
- tapOn:
    id: "Tool Details Nav Back"
- assertVisible:
    id: "Dashboard Favorites"
- tapOn:
    id: "View All Favorite Tools"
- assertVisible:
    id: "All Your Favorite Tools"
